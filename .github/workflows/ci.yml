name: CI

# A workflow only runs from the ref that carries it, so this file has to be
# on a branch for that branch to be checked at all.
#
# The push filter used to name prefixes: [main, 'gsd/**']. That silently left
# every other branch unobserved, and it cost something real — `cio/merge-lots-1-4`,
# carrying Lots 1 to 4 merged together, was pushed on 2026-09-07 with no run at
# all. A prefix list only ever guards the prefixes someone thought of.
#
# `'**'` matches every branch, slashes included, and — unlike a bare `push:` —
# excludes tags. The blocking gate is the pull_request trigger below: it filters
# the PR's target, not its source, so a PR from any branch into the trunk is
# checked. That gate was seen refusing on run 33403822473 (2026-08-31).
#
# The target is listed as BOTH `main` and `master` on purpose. The remote trunk
# was renamed from `main` to `master` on 2026-09-07, and the rename did not
# carry: GitHub moved branch protection with it, but this filter kept pointing
# at a branch that no longer existed, which silently disarmed the merge gate.
# Naming both survives the rename in either direction. Do not trim this to one
# name without checking `git ls-remote --heads origin` first.
on:
  pull_request:
    branches: [main, master]
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    # No real value may ever be written here. These are schema-valid,
    # non-secret placeholders that satisfy the boot-time environment
    # validation (src/lib/env/server.ts) so CI can run without connecting to
    # anything. Real values are supplied per environment on the hosting side.
    #
    # Scoped to the job, not to Build alone: `typecheck` runs `next typegen`,
    # which boots the app to emit route types and so hits the same validation
    # — and Type-check runs before Build. A clean checkout has no `.env.local`
    # to fall back on, which is why this passes locally and failed here.
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build
