name: CI

# A workflow only runs from the ref that carries it. Listing `main` alone
# meant this file — which lives on the phase branches — could never fire:
# a push to a `gsd/**` branch matched no trigger, and `main` has no copy of
# it to run. The check name therefore never registered, so it could not be
# required. Phase branches run it on every push, which is also what proves
# the workflow before it becomes the merge gate.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'gsd/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    # No real value may ever be written here. These are schema-valid,
    # non-secret placeholders that satisfy the boot-time environment
    # validation (src/lib/env/server.ts) so CI can run without connecting to
    # anything. Real values are supplied per environment on the hosting side.
    #
    # Scoped to the job, not to Build alone: `typecheck` runs `next typegen`,
    # which boots the app to emit route types and so hits the same validation
    # — and Type-check runs before Build. A clean checkout has no `.env.local`
    # to fall back on, which is why this passes locally and failed here.
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build
